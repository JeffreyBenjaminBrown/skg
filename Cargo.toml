[workspace]
members = ["tools/introspect/code-map", "tools/introspect/call-graph", "tools/introspect/change-forest", "tools/scope-reducer", "tools/rust-field-tags", "tests/yaml-corpus"]

[package]
name = "skg"
version = "0.1.0"
edition = "2024"
# Every tests/*.rs file used to auto-become its own ~quarter-GB test
# binary; relinking all of them after any server/ change dominated
# the test cycle (TODO/DONE/faster-tests.org). The explicit [[test]]
# targets below group them into a few binaries instead.
autotests = false

[lib]
path = "server/lib.rs"

[[bin]]
name = "skg"
path = "server/main.rs"

[[bin]]
name = "skg_filenames_match_pids"
path = "tools/introspect/skg_filenames_match_pids.rs"

[[bin]]
name = "emit-herald-rules"
path = "tools/emit-herald-rules.rs"

[[bin]]
name = "trim-node-bodies"
path = "tools/trim-node-bodies.rs"

[[bin]]
name = "smsn-keywords"
path = "thoughts/smsn/find-keywords.rs"

[[bin]]
name = "bench-prominence-inmemory"
path = "tools/bench-prominence-inmemory.rs"

[[bin]]
name = "top-contents"
path = "tools/top-contents.rs"

[[bin]]
name = "top-contentward-descendants"
path = "tools/top-contentward-descendants.rs"

[[bin]]
name = "function_conversions_for_refactor"
path = "tools/function_conversions_for_refactor/function_conversions_for_refactor.rs"

[[test]]
name = "grouped_unit"
path = "tests/grouped_unit.rs"

[[test]]
name = "grouped_views"
path = "tests/grouped_views.rs"

[[test]]
name = "grouped_overrides"
path = "tests/grouped_overrides.rs"

[[test]]
name = "grouped_saves"
path = "tests/grouped_saves.rs"

[[test]]
name = "grouped_repos"
path = "tests/grouped_repos.rs"

[dependencies]
arc-swap = "1"
ctrlc = { version = "3.4", features = ["termination"] }
ego-tree = "0.11"
filetime = "0.2"
futures = "0.3"
git2 = "0.21"
im = "15"
indoc = "2"
itertools = "0.15"
libc = "0.2"
rand = "0.10"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "1"
serde_json = "1.0"  # server/heralds.rs embeds shared/herald-styles.json
sexp = "1.1"
similar = "3"
tantivy = "0.27"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tempfile = "3.3.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.4.1", features = ["v4"] }
walkdir = "2.4"
zstd = "0.14"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = "0.13.4"
time = { version = "0.3.55", features = ["formatting"] }

[lints.rust]
unused_parens = "allow"
non_snake_case = "allow"
non_camel_case_types = "allow"

[dev-dependencies]
proptest = "1"  # fold/unfold property suite; see server/telescope/
