tantivy_folder = ".index.tantivy"
port = 1730 # TCP port for Rust-Emacs API communication.
default_repo_set = "public"

# A repo is yours (owned, writable) unless its entry says
# foreign = true.
#
# Your owned repos are listed in PRIVACY ORDER: most public first,
# most private last. That order defines the available repo-sets:
# each owned repo names the set consisting of itself and every more
# public owned repo (a prefix of the owned list); the last, the most
# private, means every owned repo. Foreign repos have no place in
# that order and may be listed anywhere; they are shown unless a
# connection hides them, apart from the repo-set. default_repo_set
# above names the repo-set when a client connects: here, your
# "public" repo (and Fred's, shown). Left out, it is the most
# private owned repo: no restriction. It must name an owned repo.

[[repos]]
name = "Fred"
path = "fred/public"
foreign = true

[[repos]]
name = "public"
path = "me/public"

[[repos]]
name = "private"
path = "me/private"
