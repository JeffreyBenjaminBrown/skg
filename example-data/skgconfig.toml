tantivy_folder = ".index.tantivy"
port = 1730 # TCP port for Rust-Emacs API communication.
default_repo_set = "public"

# Repos are listed in PRIVACY ORDER: most public first, most
# private last. That order defines the available repo-sets: each
# repo names the set consisting of itself and everything more
# public (a prefix of this list); the last repo, the most private,
# means every repo, no restriction. default_repo_set above names the
# skgrepo restriction when a client connects: here, Fred's repo and
# your "public" one. Left out, it is the most private repo.
#
# A repo is yours (owned, writable) unless its entry says
# foreign = true. Every foreign repo must be more public than every
# owned one, so foreign repos come first.

[[repos]]
name = "Fred"
path = "fred/public"
foreign = true

[[repos]]
name = "public"
path = "me/public"

[[repos]]
name = "private"
path = "me/private"
