tantivy_folder = "/tmp/placeholder"

# "foreign" says foreign = true, so it is write-protected; "main" is
# owned. See docs/api-and-formats.org, "Skgrepos".
[[repos]]
name = "foreign"
path = "foreign"
foreign = true

[[repos]]
name = "main"
path = "owned/main"

# "private", owned, is declared after "main", so it is the more
# private ('privacy_ladder').
[[repos]]
name = "private"
path = "owned/private"
