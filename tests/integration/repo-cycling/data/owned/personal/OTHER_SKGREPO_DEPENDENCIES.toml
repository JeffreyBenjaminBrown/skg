# Generated by skg; regenerated at every server start, so
# hand edits will be clobbered (that is a feature: it stays
# true to the publisher's config). Each dependency is one of
# the publisher's own Skg repos at least as public as this
# one, MOST PUBLIC FIRST, this Skg repo itself last. A
# receiver, to whom they are all foreign, folds a node with
# sections in several of them in this order. `path` is the
# data-root-relative directory; `git-remote` is where a
# receiver can fetch it (the fetch URL `git remote -v`
# prints, `origin` preferred), omitted when the Skg repo is
# not a Git repo or has no remote; `git-remote-name` names
# the remote only when it is not the conventional "origin".
# skg makes no use of the git-remote values itself.
dependencies = [
  { path = "owned/public" },
  { path = "owned/personal" },
]
