[package]
name = "yaml-corpus"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "yaml-corpus"
path = "yaml-corpus.rs"

[dependencies]
skg = { path = "../.." }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
yaml_serde = "0.10"
serde_yaml_ng = "0.10"
serde_yaml_bw = "2"
serde-saphyr = "2"
walkdir = "2"
