[process]
server = "The Rust server receives the complete Org buffer, derives save instructions, updates authoritative and derived stores, rerenders affected views, and returns the new buffer."
emacs = "Emacs prepares transient focus/fold metadata, sends the request and full buffer, waits for the length-prefixed response stream, replaces the buffer, and restores presentation state."
background = "The single Tantivy writer consumes the delta queued by the synchronous save. Search waits for this worker when it needs a fully current index; the save response does not."
other = "Samples not attributable to the synchronous save handler or Tantivy worker."

[function]
"serve::handlers::save_buffer::handle_save_buffer_request" = "The TCP handler reads the complete buffer request, runs the save future to completion, and writes either the rerendered buffer or a validation error back to Emacs."
"serve::handlers::save_buffer::update_from_and_rerender_buffer_with_approvals::closure" = "While holding the mutation gate, this orchestrator snapshots the graph, parses and validates the submitted Org view, obtains any hoist/fork approvals, builds definitions, updates stores, publishes the new graph, and rerenders affected views."
"save::update_graph_including_nodeMerges_under_mutation_gate" = "This is the save-level mutation transaction. It prepares the ordinary candidate, derives any merge candidate from that exact first candidate, retains both filesystem preflights, computes telescope warnings once against the final state for the union of affected owners, then commits each prepared phase. This test case has no node merge, but still enters the combined path."
"save::update_graph_minus_nodeMerges_with_hoist_approval" = "The ordinary-definition phase performs delete-propagation cleanup, normalizes definitions, and prepares the exact graph and filesystem updates later consumed at commit."
"save::apply_defineNodes" = "This is the multi-store commit boundary for an already-prepared ordinary update. It writes node files, publishes the exact validated in-memory candidate, and passes the candidate plus owned definitions to the Tantivy queue helper."
"save::prepare_fs_update" = "This preflights authoritative filesystem work without mutating data and returns a prepared token retained until commit, so accepted work is not parsed or derived twice."
"dbs::in_rust_graph::prepared_update::prepare_graph_update" = "This constructs the exact persistent candidate once, derives the save change set, runs affected identity and override proofs plus local inverse-index checks, and returns a snapshot-bound publication token. Its work scales with the definitions and affected neighborhood."
"dbs::in_rust_graph::prepared_update::validate_identity_and_derive_changes" = "This normalizes each saved node's extra IDs, evaluates all primary and extra-ID claims as one simultaneous final-state overlay, rejects unsafe alias revocation, and derives canonicalization changes and owners requiring reindexing."
"dbs::in_rust_graph::apply_definenodes_to_inRustGraph" = "The batch graph transform coalesces definitions by PID, installs the full final identity map, and reindexes touched and affected inbound owners under that resolver before publishing the persistent candidate."
"dbs::in_rust_graph::internal_index_validation::validate_local_internal_indexes" = "This independently recomputes only inverse-index keys that the change set could alter and compares them with the candidate. The complete checker remains for startup, rebuild, and test audits."
"dbs::in_rust_graph::override_invariants::derive_affected_override_scope" = "This derives override sources and targets whose monogamy or acyclicity truth can change, including untouched inbound overriders pulled in by canonicalization changes."
"dbs::in_rust_graph::override_invariants::validate_affected_override_invariants" = "This checks monogamy at affected targets and follows user-owned override chains from affected sources. It reports cycles and unknown ownership without traversing unrelated nodes."
"dbs::in_rust_graph::override_invariants::validate_affected_override_invariants_with_counts" = "This is the same affected override proof with an additional counter for traversed override-chain steps, used to make the incremental scaling claim visible in the generated report."
"telescope::invariants::derive_affected_telescope_owners" = "This selects saved owners plus untouched inbound owners whose warning truth can change because a target's existence, canonical PID, or home changed."
"telescope::invariants::affected_telescope_warnings" = "This applies the shared per-owner telescope primitive to the final candidate and affected-owner set. Combined saves evaluate only the final state, so transient warnings are not emitted."
"dbs::in_rust_graph::complete_validation::validate_complete_graph_candidate" = "This whole-candidate adapter is retained only as an explicit differential-test oracle. Production saves use the incremental prepared-update proof."
"dbs::in_rust_graph::complete_validation::validate_complete_graph" = "The canonical startup/rebuild validator builds global primary/extra-ID ownership maps, checks configured homes and identity collisions, constructs a fresh graph and all inverse indexes, checks override topology, independently recomputes the indexes, validates every telescope, and sorts diagnostics."
"dbs::in_rust_graph::InRustGraph::from_nodecompletes" = "This rebuilds the candidate in-memory graph in two passes over all nodes: first map every extra ID to its PID, then convert every complete node and insert its forward data and inverse-index contributions. Two passes are required because early relations can reference later nodes' extra IDs."
"types::nodes::rust::NodeRust as core::convert::From<&skg::types::nodes::complete::NodeComplete>>::from" = "Each complete node is converted to its runtime form. Besides cloning fields, conversion scans the node's body to derive outbound text-link IDs, so rebuilding the graph repeats text parsing for every node."
"types::textlinks::textlinks_from_node" = "This selects the node body and delegates extraction of every text-link target needed by the runtime graph's text-link indexes."
"types::textlinks::textlinks_from_text" = "A compiled regular expression scans one node body for PID-shaped link targets. The operation is atomic at the application level, but it is repeated for all 54,836 nodes in each full graph build."
"im::hash::map::HashMap<K,V,S>::insert" = "The persistent hash-array-mapped trie inserts a node or index entry while structurally sharing unchanged branches. This library insertion is the indivisible storage primitive used repeatedly during full graph construction."
"dbs::in_rust_graph::internal_index_validation::validate_internal_indexes" = "Independently of the just-built inverse indexes, this scans all forward node data into deterministic BTreeMap/BTreeSet expected indexes, converts each actual persistent index into the same form, and reports exact mismatches."
"dbs::in_rust_graph::internal_index_validation::compare_set_index" = "For one stored inverse index, this materializes the persistent hash map and sets as sorted B-tree collections, then asks the generic comparator for exact key/value differences."
"dbs::in_rust_graph::internal_index_validation::compare_btree_indexes" = "This unions expected and actual keys and compares their sorted value vectors. The measured child is below 5% of total CPU and is a permitted leaf."
"core::iter::traits::iterator::Iterator::collect" = "Rust's collection machinery materializes a sorted expected or actual index from an iterator. This generic library operation is below the 5% leaf threshold."
"telescope::invariants::validate_all_telescopes" = "The startup/rebuild and explicit-audit primitive visits every PID and checks the privacy/provenance constraints of each outbound relationship. Production saves use affected_telescope_warnings instead."
"dbs::in_rust_graph::override_invariants::validate_override_invariants" = "This traverses override relationships across the complete candidate graph and reports cycles, conflicts, and source-visibility violations. Its 4.2% share is below the leaf threshold."
